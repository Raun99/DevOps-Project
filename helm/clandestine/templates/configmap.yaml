apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clandestine.fullname" . }}-config
  labels:
    {{- include "clandestine.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  CANARY_COMMENT_PERCENT: {{ .Values.config.canaryCommentPercent | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  BACKEND_HOST: {{ include "clandestine.fullname" . }}-backend
  BACKEND_PORT: {{ .Values.backend.service.port | quote }}
