version: '3.8'

services:
  # ============================================================================
  # 1. Database: PostgreSQL 16 Alpine with Persistent Volume & Health Check
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: clandestine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clandestine
      POSTGRES_PASSWORD: secret_arcane_pass
      POSTGRES_DB: clandestine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clandestine -d clandestine_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clandestine_net

  # ============================================================================
  # 2. Backend: Node.js 20 Express REST API with Health Check & Migrations
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clandestine_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://clandestine:secret_arcane_pass@db:5432/clandestine_db
      JWT_SECRET: clandestine-production-jwt-super-secret-key-3.0
      FRONTEND_URL: http://localhost
      CANARY_COMMENT_PERCENT: 15
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - clandestine_net

  # ============================================================================
  # 3. Frontend: Nginx 1.27 Alpine Reverse Proxy & Static 3D WebGL Client
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clandestine_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - clandestine_net

  # ============================================================================
  # 4. Monitoring: Prometheus Metrics Collector (Optional Profile)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: clandestine_prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - clandestine_net

  # ============================================================================
  # 5. Visualization: Grafana Dashboard with Auto-Provisioning (Optional Profile)
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: clandestine_grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/clandestine:ro
    depends_on:
      - prometheus
    networks:
      - clandestine_net

volumes:
  postgres_data:
    driver: local

networks:
  clandestine_net:
    driver: bridge
