global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'clandestine-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'backend:5000'
        labels:
          environment: 'production'
          service: 'clandestine-backend'
      - targets:
          - 'host.docker.internal:5000'
          - 'localhost:5000'
        labels:
          environment: 'local-development'
          service: 'clandestine-backend-host'
