rules:
  - id: no-eval-with-dynamic-input
    languages: [javascript, typescript]
    severity: ERROR
    message: "Avoid using eval() or Function constructors as they execute arbitrary code and create critical RCE vulnerabilities."
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)

  - id: no-sql-string-concatenation
    languages: [javascript, typescript]
    severity: WARNING
    message: "Detected potential SQL injection via string concatenation or template literal in database query. Use parameterized queries ($1, $2) instead."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: query(`...${...}...`, ...)
          - pattern: query($X + $Y, ...)

  - id: require-env-for-jwt-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: "Do not hardcode JWT secrets. Always load JWT secret keys from environment variables."
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "...", ...)
          - pattern: jwt.verify($TOKEN, "...", ...)

  - id: no-plaintext-passwords-in-logs
    languages: [javascript, typescript]
    severity: WARNING
    message: "Avoid logging potential sensitive credentials or user passwords to stdout/stderr."
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
    patterns:
      - pattern-either:
          - pattern: console.log(..., $REQ.body.password, ...)
          - pattern: console.error(..., $REQ.body.password, ...)

  - id: no-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "Direct execution of shell commands via child_process.exec is dangerous. Avoid executing arbitrary system commands."
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern: child_process.exec(...)
